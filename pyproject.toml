[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zscreen-program-package"
version = "2.0.0"
description = "Z-Screen pilot data, processed cellular responses, reference models and evidence annexes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<25",
]

[project.optional-dependencies]
model = ["torch>=2.5,<3"]
analysis = ["scipy>=1.13,<2", "matplotlib>=3.8,<4"]
notebooks = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "scipy>=1.13,<2", "matplotlib>=3.8,<4"]

[project.scripts]
zscreen-program-package = "zscreen_program_package.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
